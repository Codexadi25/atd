  <!-- Loader Management Script -->
  <script>
    // Hide loader when React app loads
    function hideLoader() {
      const loader = document.getElementById('initial-loader');
      const root = document.getElementById('root');
      
      if (loader && root && root.children.length > 0) {
        loader.classList.add('fade-out');
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
        return true;
      }
      return false;
    }
    
    // Check if app loaded immediately
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        // Poll for React app to load
        const checkInterval = setInterval(() => {
          if (hideLoader()) {
            clearInterval(checkInterval);
          }
        }, 100);
        
        // Fallback: hide loader after 10 seconds
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.display = 'none';
          }
          clearInterval(checkInterval);
        }, 10000);
      });
    } else {
      // Document already loaded
      hideLoader();
    }
    
    // Performance monitoring
    window.addEventListener('load', function() {
      // Track loading performance
      if (window.gtag) {
        gtag('event', 'page_load_time', {
          event_category: 'Performance',
          event_label: 'Initial Load',
          value: Math.round(performance.now())
        });
      }
    });
  </script>
