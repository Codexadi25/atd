<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Setup Animation</title>
    <style>
        :root {
            --bg: #071028;
            --blue1: #1f6fff;
            --blue2: #0ea5ff;
            --accent: #9ad0ff;
            --size: 36vmax;
            --duration: 10s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, #021026 0%, var(--bg) 100%);
            color: #eaf6ff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Container that holds the animated orbs */
        .orb-stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Each orb wrapper rotates (circular orbit) */
        .orb {
            position: absolute;
            width: var(--size);
            height: var(--size);
            display: block;
            transform-origin: 50% 50%;
            animation: rotate var(--duration) linear infinite;
        }

        .orb.reverse {
            animation-direction: reverse;
            animation-duration: calc(var(--duration) * 1.05);
            opacity: 0.95;
        }

        /* The visible filled, blurred circle */
        .orb .core {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translateX(calc(var(--size) * 0.22));
            width: calc(var(--size) * 0.6);
            height: calc(var(--size) * 0.6);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--accent) 0%, transparent 20%),
                        radial-gradient(circle at 60% 60%, rgba(255,255,255,0.05) 0%, transparent 40%),
                        linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0)),
                        var(--blue1);
            filter: blur(28px) saturate(120%);
            mix-blend-mode: screen;
            box-shadow: 0 20px 60px rgba(20,70,150,0.5), 
                        inset 0 -10px 40px rgba(255,255,255,0.02);
            will-change: transform;
        }

        /* Second orb uses different colors and slightly different size */
        .orb.reverse .core {
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.12) 0%, transparent 18%),
                        linear-gradient(120deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0)),
                        var(--blue2);
            width: calc(var(--size) * 0.5);
            height: calc(var(--size) * 0.5);
            filter: blur(30px) saturate(120%);
            box-shadow: 0 28px 80px rgba(10,70,150,0.5);
        }

        /* Subtle additional blur discs to layer for richer effect */
        .orb .glow {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translateX(calc(var(--size) * 0.22));
            width: calc(var(--size) * 0.9);
            height: calc(var(--size) * 0.9);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20,90,220,0.06) 0%, transparent 35%);
            filter: blur(56px) saturate(120%);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Welcome overlay (center) */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(2,8,24,0.55), rgba(1,3,12,0.45));
            backdrop-filter: blur(6px) saturate(120%);
            z-index: 40;
            transition: opacity 0.8s cubic-bezier(.2,.9,.2,1), transform 0.8s;
            pointer-events: auto;
        }

        .overlay.hidden {
            opacity: 0;
            transform: translateY(12px) scale(0.995);
            pointer-events: none;
        }

        .card {
            min-width: 320px;
            max-width: 780px;
            padding: 28px 32px;
            border-radius: 14px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            box-shadow: 0 8px 28px rgba(3,10,30,0.6);
            border: 1px solid rgba(255,255,255,0.04);
            color: #eaf6ff;
        }

        .logo-dot {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue1), var(--blue2));
            box-shadow: 0 8px 30px rgba(18,90,220,0.28), 
                        inset 0 -6px 18px rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-dot::before {
            content: '';
            width: 24px;
            height: 24px;
            background: white;
            clip-path: polygon(0 0, 45% 0, 45% 45%, 0 45%), 
                       polygon(55% 0, 100% 0, 100% 45%, 55% 45%), 
                       polygon(0 55%, 45% 55%, 45% 100%, 0 100%), 
                       polygon(55% 55%, 100% 55%, 100% 100%, 55% 100%);
        }

        .title {
            font-size: 20px;
            letter-spacing: 0.2px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .sub {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        .progress {
            height: 10px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress > i {
            display: block;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--blue1), var(--blue2));
            box-shadow: 0 6px 18px rgba(10,85,220,0.35);
            animation: prog 5s linear forwards;
            border-radius: 999px;
        }

        @keyframes prog {
            0% { width: 0%; }
            100% { width: 88%; }
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.8;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(3, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        /* Respect users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .orb, .orb .core, .orb .glow {
                animation: none;
                transform: none !important;
                filter: blur(26px);
            }
            .orb-stage {
                opacity: 0.98;
            }
        }

        /* Responsive tweaks for small screens */
        @media (max-width: 520px) {
            :root {
                --size: 80vmax;
            }
            .card {
                padding: 20px;
                border-radius: 12px;
            }
            .logo-dot {
                width: 48px;
                height: 48px;
                border-radius: 10px;
            }
            .logo-dot::before {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated orbs -->
    <div class="orb-stage" aria-hidden="true">
        <div class="orb" style="--i:1;">
            <div class="core" aria-hidden="true"></div>
            <div class="glow" aria-hidden="true"></div>
        </div>

        <div class="orb reverse" style="--i:2;">
            <div class="core" aria-hidden="true"></div>
            <div class="glow" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Centered content area -->
    <main style="position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <!-- Empty to highlight background -->
    </main>

    <!-- Welcome overlay -->
    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Setup dialog - Setting up Windows">
        <div class="card" tabindex="0">
            <div class="logo-dot" aria-hidden="true"></div>
            <div class="title">Setting up Windows</div>
            <div class="sub">Please wait — configuring your device<span class="loading-dots"></span></div>
            <div class="progress" aria-hidden="true" title="Installation progress">
                <i></i>
            </div>
            <div class="hint">This may take a few moments. Click anywhere to continue.</div>
        </div>
    </div>

    <script>
        // Auto-hide overlay after timeout and allow click to dismiss
        (function() {
            const overlay = document.getElementById('overlay');
            const HIDE_AFTER_MS = 4800;

            function hideOverlay() {
                if (!overlay) return;
                overlay.classList.add('hidden');
                setTimeout(() => {
                    if (overlay && overlay.parentElement) {
                        overlay.parentElement.removeChild(overlay);
                    }
                }, 950);
            }

            const timer = setTimeout(hideOverlay, HIDE_AFTER_MS);

            overlay.addEventListener('click', () => {
                clearTimeout(timer);
                hideOverlay();
            });

            overlay.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === 'Escape') {
                    clearTimeout(timer);
                    hideOverlay();
                }
            });

            const card = overlay.querySelector('.card');
            if (card) card.focus();
        })();
    </script>
</body>
</html>
